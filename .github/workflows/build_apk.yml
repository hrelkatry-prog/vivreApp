name: Build Vivre Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Generate Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Flutter SDK Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Install Dependencies
        run: flutter pub get

      - name: 5. Build Android Release APK
        run: |
          set +e
          flutter build apk --release --android-skip-build-dependency-validation --verbose > build.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "Build failed with code $STATUS"
            exit $STATUS
          fi

      - name: 6. Upload APK as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vivre-App-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: 7. Publish GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: Vivre Mobile App v1.0.${{ github.run_number }}
          tag_name: v1.0.${{ github.run_number }}
          body: |
            ## 📱 تطبيق Vivre الميداني لتوزيع المياه
            - تم البناء السحابي تلقائياً بنجاح عبر GitHub Actions.
            - يمكنك تحميل ملف الـ APK المرفق وتثبيته مباشرة على هواتف الأندرويد.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Diagnostic - Commit Log on Failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-diagnostics
          echo "=== BUILD LOG DIAGNOSTICS ===" > BUILD_DIAGNOSTICS.txt
          tail -n 350 build.log >> BUILD_DIAGNOSTICS.txt || true
          git add BUILD_DIAGNOSTICS.txt
          git commit -m "Auto diagnostics for run ${{ github.run_number }}" || true
          git push -f origin build-diagnostics || true
