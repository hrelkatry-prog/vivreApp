name: vivre_mobile_app
description: "Vivre - تطبيق إدارة وتعبئة وتوزيع المياه الذكي"
publish_to: 'none'
version: 1.0.32+32

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # High-performance InAppWebView with HTML5 Geolocation bridge
  flutter_inappwebview: ^6.1.5

  # Native Android/iOS Permissions & GPS Hardware Service Manager
  permission_handler: ^11.3.1

  # Network Connectivity
  connectivity_plus: ^6.1.0

  # UI & Typography
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
