name: vivre_mobile_app
description: "Vivre - تطبيق إدارة وتعبئة وتوزيع المياه الذكي"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # High-performance InAppWebView with HTML5 Geolocation bridge
  flutter_inappwebview: ^6.1.5

  # GPS & Location Services
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  # Network Connectivity
  connectivity_plus: ^6.1.1

  # UI, Typography & Animations
  google_fonts: ^6.2.1
  flutter_spinkit: ^5.2.1
  url_launcher: ^6.3.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
